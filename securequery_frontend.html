<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SecureQuery</title>
<style>
  :root {
    --bg: #F5F7F7;
    --surface: #FFFFFF;
    --ink: #16211F;
    --ink-soft: #55635F;
    --line: #DCE3E1;
    --teal: #0E6B5C;
    --teal-dark: #0A4F44;
    --amber: #9A6B14;
    --amber-bg: #FBF1DD;
    --red: #A63A2E;
    --red-bg: #FBEAE6;
    --green-bg: #E8F3EE;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121716;
      --surface: #1A211F;
      --ink: #E9EEEC;
      --ink-soft: #93A19C;
      --line: #2A3432;
      --teal: #35A08C;
      --teal-dark: #2A8272;
      --amber: #D9A94D;
      --amber-bg: #2C2617;
      --red: #E08776;
      --red-bg: #2E1D19;
      --green-bg: #17281F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121716; --surface: #1A211F; --ink: #E9EEEC; --ink-soft: #93A19C;
    --line: #2A3432; --teal: #35A08C; --teal-dark: #2A8272; --amber: #D9A94D;
    --amber-bg: #2C2617; --red: #E08776; --red-bg: #2E1D19; --green-bg: #17281F;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  #login-view {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 36px 32px;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .mark-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--teal);
    flex-shrink: 0;
  }
  .mark-text {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .mark-sub {
    color: var(--ink-soft);
    font-size: 13px;
  }
  h1 {
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .field-label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 18px 0 6px;
  }
  input[type=email], input[type=password], input[type=text], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--teal);
  }
  button {
    font-family: var(--font);
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    width: 100%;
    margin-top: 22px;
    padding: 11px 16px;
    background: var(--teal);
    color: white;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .err-box {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--red-bg);
    color: var(--red);
    border-radius: 7px;
    font-size: 13px;
    display: none;
  }
  .err-box.show { display: block; }

  /* ---------- App shell ---------- */
  #app-view { min-height: 100%; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header .who {
    font-size: 13px;
    color: var(--ink-soft);
  }
  header .who strong { color: var(--ink); font-weight: 600; }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 13px;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-soft); }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 16px;
    color: var(--ink-soft);
  }
  textarea {
    min-height: 76px;
    resize: vertical;
  }
  .row {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    align-items: center;
  }
  .row select { flex: 1; }
  .ask-btn {
    padding: 10px 20px;
    background: var(--teal);
    color: white;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ask-btn:hover { background: var(--teal-dark); }
  .ask-btn:disabled { opacity: 0.55; cursor: default; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Results ---------- */
  .sql-box {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 12px 14px;
    color: var(--ink-soft);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th, td {
    text-align: left;
    padding: 10px 6px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  th { color: var(--ink-soft); font-weight: 500; font-size: 12.5px; }
  td.value-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .badge-ok { background: var(--green-bg); color: var(--teal-dark); }
  .badge-masked { background: var(--amber-bg); color: var(--amber); }
  .masked-text { color: var(--amber); font-style: italic; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 4px;
  }
  .stat {
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 7px;
  }
  .stat .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .bar-label { width: 90px; font-size: 12.5px; color: var(--ink-soft); flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--bg); border-radius: 4px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--teal); border-radius: 4px; }
  .bar-val { width: 48px; text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .rejected-box {
    padding: 14px 16px;
    background: var(--red-bg);
    color: var(--red);
    border-radius: 7px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .rejected-box strong { display: block; margin-bottom: 4px; }

  .empty-hint {
    color: var(--ink-soft);
    font-size: 13.5px;
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-view">
  <div class="login-card">
    <div class="mark">
      <span class="mark-dot"></span>
      <span class="mark-text">SecureQuery</span>
    </div>
    <h1>Researcher sign in</h1>
    <div class="mark-sub">Privacy-preserving multi-hospital analytics</div>

    <label class="field-label" for="login-email">Email</label>
    <input type="email" id="login-email" placeholder="you@institution.org" autocomplete="username">

    <label class="field-label" for="login-password">Password</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">

    <button class="btn-primary" id="login-btn">
      <span id="login-btn-text">Sign in</span>
    </button>

    <div class="err-box" id="login-err"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-view" class="hidden">
  <header>
    <div class="mark">
      <span class="mark-dot"></span>
      <span class="mark-text">SecureQuery</span>
    </div>
    <div class="row" style="margin-top:0;">
      <span class="who">Signed in as <strong id="who-email"></strong></span>
      <button class="btn-ghost" id="logout-btn">Log out</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Ask a question</h2>
      <textarea id="question-input" placeholder="e.g. How many diabetes patients per hospital?"></textarea>
      <div class="row">
        <select id="purpose-select">
          <option value="diabetes_surveillance">Diabetes surveillance</option>
          <option value="hypertension_surveillance">Hypertension surveillance</option>
        </select>
        <button class="ask-btn" id="ask-btn">
          <span class="spinner" id="ask-spinner"></span>
          <span id="ask-btn-text">Ask</span>
        </button>
      </div>
    </div>

    <div id="results-area"></div>
  </main>
</div>

<script>
  const API_BASE = "http://127.0.0.1:8000";
  let token = null;
  let userEmail = null;

  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");
  const loginBtn = document.getElementById("login-btn");
  const loginBtnText = document.getElementById("login-btn-text");
  const loginErr = document.getElementById("login-err");
  const whoEmail = document.getElementById("who-email");
  const logoutBtn = document.getElementById("logout-btn");
  const askBtn = document.getElementById("ask-btn");
  const askBtnText = document.getElementById("ask-btn-text");
  const askSpinner = document.getElementById("ask-spinner");
  const resultsArea = document.getElementById("results-area");
  const questionInput = document.getElementById("question-input");
  const purposeSelect = document.getElementById("purpose-select");

  function showLogin() {
    loginView.classList.remove("hidden");
    appView.classList.add("hidden");
  }
  function showApp() {
    loginView.classList.add("hidden");
    appView.classList.remove("hidden");
    whoEmail.textContent = userEmail || "";
  }

  async function handleLogin() {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    loginErr.classList.remove("show");

    if (!email || !password) {
      loginErr.textContent = "Enter both email and password.";
      loginErr.classList.add("show");
      return;
    }

    loginBtn.disabled = true;
    loginBtnText.textContent = "Signing in…";

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      if (res.status === 401) {
        loginErr.textContent = "Incorrect email or password.";
        loginErr.classList.add("show");
        return;
      }
      if (!res.ok) {
        loginErr.textContent = `Sign-in failed (status ${res.status}).`;
        loginErr.classList.add("show");
        return;
      }

      const data = await res.json();
      token = data.access_token;
      userEmail = email;
      showApp();
    } catch (e) {
      loginErr.textContent = "Couldn't reach the server. Is the backend running on localhost:8000?";
      loginErr.classList.add("show");
    } finally {
      loginBtn.disabled = false;
      loginBtnText.textContent = "Sign in";
    }
  }

  function handleLogout() {
    token = null;
    userEmail = null;
    resultsArea.innerHTML = "";
    questionInput.value = "";
    document.getElementById("login-email").value = "";
    document.getElementById("login-password").value = "";
    showLogin();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function renderRejected(message, errors) {
    let html = `<div class="card"><div class="rejected-box"><strong>Query couldn't be answered</strong>${escapeHtml(message)}`;
    if (errors && errors.length) {
      html += `<ul style="margin:8px 0 0;padding-left:18px;">` +
        errors.map(e => `<li>${escapeHtml(e)}</li>`).join("") + `</ul>`;
    }
    html += `</div></div>`;
    resultsArea.innerHTML = html;
  }

  function renderResults(data) {
    const results = Array.isArray(data.results) ? data.results : [];
    const analytics = data.analytics || {};
    const stats = analytics.stats || {};
    const chart = (analytics.charts && analytics.charts[0]) || null;

    let html = `<div class="card">
      <h2>Generated query</h2>
      <div class="sql-box">${escapeHtml(data.generated_sql || "—")}</div>
    </div>`;

    html += `<div class="card"><h2>Results by hospital</h2>`;
    if (results.length === 0) {
      html += `<div class="empty-hint">No results returned.</div>`;
    } else {
      html += `<table><thead><tr><th>Hospital</th><th>Value</th><th>Status</th></tr></thead><tbody>`;
      for (const r of results) {
        const isMasked = !r.disclosed;
        const valCell = isMasked
          ? `<span class="masked-text">below disclosure threshold</span>`
          : escapeHtml(r.value);
        const badge = isMasked
          ? `<span class="badge badge-masked">Masked</span>`
          : `<span class="badge badge-ok">Disclosed</span>`;
        html += `<tr>
          <td>${escapeHtml(r.group_key)}</td>
          <td class="value-cell">${valCell}</td>
          <td>${badge}</td>
        </tr>`;
      }
      html += `</tbody></table>`;
    }
    html += `</div>`;

    if (Object.keys(stats).length) {
      html += `<div class="card"><h2>Summary</h2><div class="stats-grid">`;
      const statLabels = {
        total_groups: "Total groups",
        disclosed_groups: "Disclosed",
        masked_groups: "Masked",
        sum_disclosed_values: "Sum",
        avg_disclosed_value: "Average",
      };
      for (const [key, label] of Object.entries(statLabels)) {
        if (stats[key] === undefined || stats[key] === null) continue;
        const val = typeof stats[key] === "number"
          ? (Number.isInteger(stats[key]) ? stats[key] : stats[key].toFixed(1))
          : stats[key];
        html += `<div class="stat"><div class="num">${val}</div><div class="lbl">${label}</div></div>`;
      }
      html += `</div></div>`;
    }

    if (chart && chart.labels && chart.labels.length) {
      const maxVal = Math.max(...chart.values, 1);
      html += `<div class="card"><h2>${escapeHtml(chart.title || "Chart")}</h2>`;
      chart.labels.forEach((label, i) => {
        const val = chart.values[i];
        const pct = Math.max((val / maxVal) * 100, 3);
        html += `<div class="bar-row">
          <div class="bar-label">${escapeHtml(label)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-val">${val}</div>
        </div>`;
      });
      html += `</div>`;
    }

    resultsArea.innerHTML = html;
  }

  async function handleAsk() {
    const question = questionInput.value.trim();
    const purpose = purposeSelect.value;

    if (!question) {
      resultsArea.innerHTML = `<div class="card"><div class="empty-hint">Type a question first.</div></div>`;
      return;
    }

    askBtn.disabled = true;
    askSpinner.classList.add("show");
    askBtnText.textContent = "Asking…";
    resultsArea.innerHTML = "";

    try {
      const res = await fetch(`${API_BASE}/query/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
        },
        body: JSON.stringify({ question, purpose }),
      });

      if (res.status === 401) {
        handleLogout();
        return;
      }

      const data = await res.json();

      if (res.status === 400) {
        const detail = data.detail || {};
        renderRejected(
          typeof detail === "string" ? detail : (detail.message || "The generated query was rejected."),
          typeof detail === "object" ? detail.errors : null
        );
        return;
      }

      if (!res.ok) {
        renderRejected(`Unexpected error (status ${res.status}).`, null);
        return;
      }

      renderResults(data);
    } catch (e) {
      renderRejected("Couldn't reach the server. Is the backend running?", null);
    } finally {
      askBtn.disabled = false;
      askSpinner.classList.remove("show");
      askBtnText.textContent = "Ask";
    }
  }

  loginBtn.addEventListener("click", handleLogin);
  document.getElementById("login-password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleLogin();
  });
  logoutBtn.addEventListener("click", handleLogout);
  askBtn.addEventListener("click", handleAsk);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) handleAsk();
  });

  showLogin();
</script>
</body>
</html>
